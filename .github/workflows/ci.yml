name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quote_editor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      chrome:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --add-host=host.docker.internal:host-gateway
          --shm-size=2g

    env:
      RAILS_ENV: test
      DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/quote_editor_test
      SELENIUM_REMOTE_URL: http://127.0.0.1:4444/wd/hub

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Check Postgres is reachable
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d quote_editor_test -c "select 1;"

      - name: Show DB env vars
        run: |
          echo "RAILS_ENV=$RAILS_ENV"
          echo "DATABASE_URL=$DATABASE_URL"
          echo "DATABASE_URL_TEST=$DATABASE_URL_TEST"

      - name: Prepare DB
        run: bin/rails db:prepare

      - name: Run system tests
        run: bin/rails test:system
